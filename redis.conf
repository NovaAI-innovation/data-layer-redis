# data-layer-redis/redis.conf
#
# Hardened redis 7.2 config for the data-layer cache layer.
# Application-layer guards (tenant prefix, TTL cap, bypass flag,
# miss-on-error) live in write_through.py; this config covers the
# server itself.

# ── Network ─────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# ── General ─────────────────────────────────────────────────────────
databases 16
loglevel notice
logfile ""

# ── Snapshotting (RDB) — disabled in favour of AOF below ────────────
save ""
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "dump.rdb"
dir /data

# ── Append Only File (AOF) — primary durability mechanism ──────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ── Memory ──────────────────────────────────────────────────────────
# Bounded by the OS; we don't override maxmemory here. The
# application-layer TTL cap (DATA_LAYER_REDIS_TTL, default 300s)
# enforces the upper bound on key age.
maxmemory-policy noeviction

# ── Lazy freeing ────────────────────────────────────────────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ── Slow log ────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency monitoring ─────────────────────────────────────────────
latency-monitor-threshold 100

# ── Threading (Redis 6+ I/O threads) — disabled, single-threaded
# is sufficient for our scale; document the trade-off ────────────────
io-threads 1
io-threads-do-reads no

# ── Keyspace notifications ─────────────────────────────────────────
# Disabled by default (extra CPU). Enable here only if write_through
# or the publish hook needs to subscribe to expired-key events;
# future work.
notify-keyspace-events ""